<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrar — Extrato de Tomate</title>
<meta name="theme-color" content="#101010">
<link rel="stylesheet" href="./styles.css">
<style>
  body { cursor: default; overflow-y: auto; }
  #app { padding: 0; }
  .login-page { max-width: 460px; margin: 0 auto; padding: 28px 20px 40px; }
  .login-page h1 { font-size: 26px; margin: 0 0 6px; }
  .login-page p { color: #9A9AA4; font-size: 14px; line-height: 1.5; margin: 0 0 18px; }
  .field { width: 100%; margin-bottom: 12px; padding: 14px 16px; border-radius: 12px;
           border: 1px solid #33333f; background: #101014; color: #fff; font-size: 16px; }
  .field:focus { outline: none; border-color: #F25022; }
  .captcha { margin: 10px 0 16px; }
  .actions { display: flex; gap: 10px; align-items: center; }
  .btn.primary { font-size: 16px; padding: 14px 24px; border-radius: 999px; }
  .msg { font-size: 14px; margin: 0 0 12px; }
  .msg.error { color: #FF8A6A; }
  .msg.ok { color: #8DE08D; }
  .hint { font-size: 12px; color: #6E6E78; margin-top: 14px; }
</style>
</head>
<body>
<div id="app">
  <div class="login-page">
    <h1>Entrar</h1>
    <p>Mesma conta do aplicativo. O captcha é resolvido aqui, dentro do app — e o acesso fica salvo no aparelho.</p>
    <input id="email" class="field" type="email" placeholder="E-mail" autocomplete="username">
    <input id="password" class="field" type="password" placeholder="Senha" autocomplete="current-password">
    <div id="captcha" class="captcha"></div>
    <p id="msg" class="msg"></p>
    <div class="actions">
      <button id="submit" class="btn primary">Entrar</button>
    </div>
    <p class="hint">Se o captcha não aparecer, recarregue a página.</p>
  </div>
</div>
<script src="./config.js"></script>
<script src="./tomato.js"></script>
<script>
(function () {
  var captchaHandle = null;
  var msg = document.getElementById('msg');

  function show(text, isError) {
    msg.textContent = text;
    msg.className = 'msg ' + (isError ? 'error' : 'ok');
  }

  window.Tomato.loadCaptcha(document.getElementById('captcha'), window.EXTRATO_CONFIG.hcaptchaKey)
    .then(function (handle) { captchaHandle = handle; })
    .catch(function () { show('Captcha não carregou. Recarregue a página.', true); });

  document.getElementById('submit').onclick = function () {
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    if (!email || !password) { show('Preencha e-mail e senha.', true); return; }
    show('Entrando…', false);
    window.Tomato.login(email, password, captchaHandle ? captchaHandle.getToken() : '')
      .then(function (result) {
        show('Pronto! Voltando para o app…', false);
        var target = 'extrato://auth?token=' + encodeURIComponent(result.token)
          + '&email=' + encodeURIComponent(email);
        setTimeout(function () { window.location.href = target; }, 600);
      })
      .catch(function (error) {
        show(error.message || 'Não consegui entrar.', true);
        if (captchaHandle && captchaHandle.reset) { captchaHandle.reset(); }
      });
  };
})();
</script>
</body>
</html>
